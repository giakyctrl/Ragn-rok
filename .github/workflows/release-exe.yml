name: Release Windows Desktop App (.exe)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Windows Packages with Electron Builder
        run: |
          npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: Yggdrasill-Windows-Packages
          path: |
            dist-electron/*.exe
            dist-electron/*.zip
          if-no-files-found: warn

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist-electron/*.exe
            dist-electron/*.zip
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.4' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Yggdrasill {0} — Desktop App (.exe & Portable)', github.ref_name) || 'Yggdrasill v1.0.4 — Desktop App (.exe & Portable)' }}
          body: |
            # Yggdrasill v1.0.4 — Desktop App per Windows (Dungeon Alchemist Complete: Biomi, Alture, Liquidi & Scalatura)

            Companion Visuale e Gestionale definitivo per sessioni dal vivo di **D&D 5e / Journey to Ragnarok** con **Fucina 3D per Miniature (stile HeroForge)** e **Map Maker 3D (stile Dungeon Alchemist)**.

            ---

            ### 📦 Download Disponibili:
            - **`Yggdrasill-Windows-x64-Portable.zip` (CONSIGLIATO)**: Archivio portatile non compresso da installer, include il launcher anti-blocco `Avvia_Yggdrasill.bat`. Estrai ed avvia subito senza installazione!
            - **`Yggdrasill-Portable-1.0.4.exe`**: Singolo file eseguibile portatile pronto all'uso.
            - **`Yggdrasill-Setup-1.0.4.exe`**: Installer tradizionale Windows con scorciatoie sul Desktop e Menu Avvio.

            ---

            ### 🛡️ Nota per Microsoft Defender / Windows SmartScreen
            Essendo un'applicazione indipendente open-source priva di un costoso certificato commerciale EV (oltre 500$/anno):
            - **Se usi il pacchetto ZIP:** Estrai la cartella ed esegui `Avvia_Yggdrasill.bat` (oppure `Yggdrasill.exe`). Lo script rimuove in automatico il blocco temporaneo di Windows (*Mark-of-the-Web*).
            - **Se usi l'installer `.exe`:** Nella schermata blu di Windows SmartScreen (*"PC protetto da Windows"*), clicca su **"Ulteriori informazioni"** e poi sul pulsante **"Esegui comunque"**.

            ---

            ### ⚔️ Novità Versione 1.0.4 (Dungeon Alchemist Advanced Features):
            - **Dimensioni e Confini Mappa Configurabili**:
              * Preset rapidi: **15x15** (22.5m x 22.5m), **20x20** (30m x 30m), **30x30** (45m x 45m), **40x40** (60m x 60m) e dimensioni personalizzate al metro.
              * Riquadro perimetrale ciano luminescente sul piano WebGL per delimitare chiaramente l'area modificabile.
            - **Pittura Biomi Diversificati**:
              * Selezione rapida e pennello biomi tra: *Neve di Midgardr*, *Prato Smeraldo & Muschio*, *Roccia Basaltica*, *Sabbia dei Fiordi*, *Ciottoli e Selciato*.
              * Pennello a raggio singolo (1x1) o allargato (3x3).
            - **Scultura Terreno 3D (Alture, Colline & Depressioni)**:
              * Pennello per innalzare alture (+0.75m o quota fissa) e scavare trincee/depressioni (-0.75m).
              * Generazione procedurale automatica di **scogliere rocciose verticali (cliff skirts)** sotto ogni porzione sopraelevata.
            - **Liquidi 3D Dinamici con Luci Reali**:
              * *Acqua Cristallina dei Fiordi* con mesh sinusoidale e onde ondulatorie animate in tempo reale.
              * *Lava Vulcanica Incandescente* con bagliore emissivo e sorgente luminosa reale PointLight arancione dinamica.
              * *Acido Tossico Fluorescente* e *Melma di Palude*.
              * Pulsante automatico *Riempi Depressioni con Acqua*.
            - **Strutture ed Edifici Scalabili**:
              * Selettore di scala rapido (0.5x, 0.75x, 1.0x, 1.5x, 2.0x, 3.0x) per case vichinghe, torri, palizzate, alberi o casse.
            - **Doppia Modalità Telecamera (2D Zenitale vs 3D Libera)**:
              * Commutazione istantanea con un clic tra *Vista 2D (Dall'Alto a 90° con Pan & Zoom)* per VTT/proiezione a tavolo e *Vista 3D Libera Orbitale a 360°*.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
