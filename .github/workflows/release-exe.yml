name: Release Windows Desktop App (.exe)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Windows Packages with Electron Builder
        run: |
          npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: Yggdrasill-Windows-Packages
          path: |
            dist-electron/*.exe
            dist-electron/*.zip
          if-no-files-found: warn

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist-electron/*.exe
            dist-electron/*.zip
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.2' }}
          name: "Yggdrasill v1.0.2 — Desktop App (.exe & Portable)"
          body: |
            # Yggdrasill v1.0.2 — Desktop App per Windows

            Companion Visuale e Gestionale definitivo per sessioni dal vivo di **D&D 5e / Journey to Ragnarok** con **Fucina 3D per Miniature (stile HeroForge)** e **Map Maker 3D (stile Dungeon Alchemist)**.

            ---

            ### 📦 Download Disponibili:
            - **`Yggdrasill-Windows-x64-Portable.zip` (CONSIGLIATO)**: Archivio portatile non compresso da installer, include il launcher anti-blocco `Avvia_Yggdrasill.bat`. Estrai ed avvia subito senza installazione!
            - **`Yggdrasill-Portable-1.0.2.exe`**: Singolo file eseguibile portatile pronto all'uso.
            - **`Yggdrasill-Setup-1.0.2.exe`**: Installer tradizionale Windows con scorciatoie sul Desktop e Menu Avvio.

            ---

            ### 🛡️ Nota per Microsoft Defender / Windows SmartScreen
            Essendo un'applicazione indipendente open-source priva di un costoso certificato commerciale EV (oltre 500$/anno):
            - **Se usi il pacchetto ZIP:** Estrai la cartella ed esegui `Avvia_Yggdrasill.bat` (oppure `Yggdrasill.exe`). Lo script rimuove in automatico il blocco temporaneo di Windows (*Mark-of-the-Web*).
            - **Se usi l'installer `.exe`:** Nella schermata blu di Windows SmartScreen (*"PC protetto da Windows"*), clicca su **"Ulteriori informazioni"** e poi sul pulsante **"Esegui comunque"**.

            ---

            ### ⚔️ Novità Versione 1.0.2:
            - **Map Maker 3D Stile Dungeon Alchemist**: Motore 3D potenziato con 46 veri modelli `.glb` ad alta qualità (scale con corrimano, case norrene con tetto a scandole e paglia, cancelli, palizzate difensive, carretti mercantili, lanterne, stendardi e alberi).
            - **Generatore di Entrata del Villaggio Vichingo**: Generazione procedurale in 1 clic dell'ingresso fortificato con palizzata, torri di guardia, rampe e carro merci (ispirato al video tutorial Dungeon Alchemist).
            - **Runa Ufficiale**: Runa autentica della homepage applicata all'icona di sistema dell'app, favicon e interfaccia.
            - **Zero Dadi Virtuali & Offline-First**: Supporto al gioco dal vivo fedele alle regole *Journey to Ragnarok*.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
