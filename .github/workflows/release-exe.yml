name: Release Windows Desktop App (.exe)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Windows Packages with Electron Builder
        run: |
          npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: Yggdrasill-Windows-Packages
          path: |
            dist-electron/*.exe
            dist-electron/*.zip
          if-no-files-found: warn

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist-electron/*.exe
            dist-electron/*.zip
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.3' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Yggdrasill {0} — Desktop App (.exe & Portable)', github.ref_name) || 'Yggdrasill v1.0.3 — Desktop App (.exe & Portable)' }}
          body: |
            # Yggdrasill v1.0.3 — Desktop App per Windows (Stile Dungeon Alchemist Definitivo)

            Companion Visuale e Gestionale definitivo per sessioni dal vivo di **D&D 5e / Journey to Ragnarok** con **Fucina 3D per Miniature (stile HeroForge)** e **Map Maker 3D (stile Dungeon Alchemist)**.

            ---

            ### 📦 Download Disponibili:
            - **`Yggdrasill-Windows-x64-Portable.zip` (CONSIGLIATO)**: Archivio portatile non compresso da installer, include il launcher anti-blocco `Avvia_Yggdrasill.bat`. Estrai ed avvia subito senza installazione!
            - **`Yggdrasill-Portable-1.0.3.exe`**: Singolo file eseguibile portatile pronto all'uso.
            - **`Yggdrasill-Setup-1.0.3.exe`**: Installer tradizionale Windows con scorciatoie sul Desktop e Menu Avvio.

            ---

            ### 🛡️ Nota per Microsoft Defender / Windows SmartScreen
            Essendo un'applicazione indipendente open-source priva di un costoso certificato commerciale EV (oltre 500$/anno):
            - **Se usi il pacchetto ZIP:** Estrai la cartella ed esegui `Avvia_Yggdrasill.bat` (oppure `Yggdrasill.exe`). Lo script rimuove in automatico il blocco temporaneo di Windows (*Mark-of-the-Web*).
            - **Se usi l'installer `.exe`:** Nella schermata blu di Windows SmartScreen (*"PC protetto da Windows"*), clicca su **"Ulteriori informazioni"** e poi sul pulsante **"Esegui comunque"**.

            ---

            ### ⚔️ Novità Versione 1.0.3 (Dungeon Alchemist True Architecture):
            - **Nuova Barra Superiore e Struttura a 5 Modalità (Autentico Stile Dungeon Alchemist)**:
              * Rimossi i vecchi bottoni singoli nell'header: ora l'editor è diviso organicamente nelle 5 discipline creative principali.
              * `[ 🏠 Disegna Stanza ]`: Generatore AI procedurale con 8 temi architettonici norreni (Entrata Villaggio con torrette e palizzata, Taverna dell'Idromele, Sala del Trono del Jarl, Capanna Vichinga, Torre di Guardia, Fucina del Fabbro, Cripta Sotterranea, Accampamento Innevato) e selettore dimensioni (4x4, 6x6, 8x6).
              * `[ 🪑 Oggetti ]`: Catalogo 3D categorizzato per Scale multilivello con corrimano/parapetto (+1.5m), Mura e portali in pietra/legno, Arredi di lusso e tavoli da banchetto, Casse e scorte, Luci e Natura.
              * `[ ⛰️ Terreno & Biomi ]`: Motore di pittura del terreno con pennello 1x1 e 3x3 per dipingere Manto Nevoso, Sentieri in Terra Battuta/Fango, Tavolato in Legno, Lastricato Fortezza, Roccia Montana e Lastre Runiche Sacre, oltre al pulsante *Riempi Intera Mappa*.
              * `[ 🌤️ Ambiente & Luce ]`: Pannello dedicato con separazione rigorosa tra **Ora del Giorno** (*Giorno pieno*, *Tramonto aureo*, *Notte profonda*) ed **Effetti Meteo** (*Sereno*, *Bufera di Neve con particelle 3D animate*, *Aurora Boreale vibrante verde/ciano*, *Nebbia Spettrale volumetrica*), oltre al moltiplicatore d'intensità per le torce e fiamme dinamiche.
              * `[ ♟️ Token & Eroi ]`: Gestione pedine con miniature 3D eroi, sincronizzazione real-time e spawner istantaneo di mostri norreni del DM (Lupo dell'Inverno, Draugr dei Ghiacci, Berserker, Scheletri, Jötunn).
            - **Modalità Cinematica Prima Persona (`Alt + Home` / Tasto `🎥 Cinematica`)**:
              * Esplorazione immersiva della mappa ad altezza occhi (1.7m) con comandi WASD per camminare e mouse a 360°.
              * Interfaccia grafica completamente nascosta per la massima spettacolarità, con floating HUD minimo ed elegante.
              * Tasto rapido **`F`** per scattare istantaneamente uno snapshot HD pulito senza UI, e **`ESC`** per tornare all'editor.
            - **Logo Runa Homepage Ufficiale**:
              * Runa Peorð geometrica autentica integrata nell'icona .ico, splashscreen, favicon e topbar.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
