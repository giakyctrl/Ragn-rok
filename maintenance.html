<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sito in Manutenzione - D&D Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #090b10; color: #f3f4f6; }
    .font-cinzel { font-family: 'Cinzel', serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
  <div class="max-w-md w-full bg-gray-900 border border-amber-500/40 rounded-2xl p-8 shadow-2xl space-y-4">
    <div class="w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-3xl mx-auto">
      🛠️
    </div>
    <h1 class="font-cinzel text-2xl font-bold text-amber-400">SESSIONE IN PAUSA</h1>
    <p class="text-xs text-gray-400 leading-relaxed">
      Il Dungeon Master sta aggiornando il mondo di gioco, preparando nuovi loot o modificando le schede. Torna tra poco!
    </p>
    <div class="pt-4 border-t border-gray-800">
      <button onclick="location.reload()" class="w-full py-2.5 bg-amber-500 text-gray-950 font-bold rounded-xl text-xs shadow">
        🔄 Riprova a Connetterti
      </button>
    </div>
  </div>
</body>
</html>
